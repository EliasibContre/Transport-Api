services:
  postgres:
    image: postgres:17
    container_name: transport-postgres

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - transport_postgres_data:/var/lib/postgresql/data


volumes:
  transport_postgres_data:
